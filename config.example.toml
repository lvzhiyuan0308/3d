[paths]
smplx_model = "D:/App/threeD/smplx_models/models_lockedhead/smplx/SMPLX_FEMALE.npz"
original_photo = "data/original.jpg"
turnaround = "data/turnaround.png"
work_dir = "work"
# Optional: enables V1/V2 comparison render; never needed for reconstruction.
# baseline_delivery = "../multiview_work/delivery"

[runtime]
device = "auto" # auto | cpu | cuda

[face]
# x0, y0, x1, y1 in the original photo and the cropped front-view image.
photo_crop = [290, 40, 480, 235]
reference_crop = [60, 0, 165, 115]

# Bounds for the original 791 x 614 four-panel reference board.
# For another layout, change all four crops (left, top, right, bottom).
[[views]]
name = "front"
crop = [12, 36, 223, 570]
yaw_deg = 0
[[views]]
name = "left"
crop = [227, 36, 398, 570]
yaw_deg = 90
[[views]]
name = "right"
crop = [402, 36, 579, 570]
yaw_deg = -90
[[views]]
name = "back"
crop = [583, 36, 783, 570]
yaw_deg = 180
